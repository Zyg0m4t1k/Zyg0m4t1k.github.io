    <rect x="20" y="430" width="260" height="40" rx="0" fill="#0c1220" opacity="0.9"/>
    <text x="60" y="456" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#69aeff">⌂</text>
    <text x="130" y="456" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#8a9ab2">⊞</text>
    <text x="200" y="456" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#8a9ab2">≡</text>
    <!-- Home bar -->
    <rect x="110" y="478" width="80" height="5" rx="3" fill="#3b82f6" opacity="0.4"/>

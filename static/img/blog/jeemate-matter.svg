    <text x="40" y="320" font-family="sans-serif" font-size="16" fill="#69aeff">◈</text>
    <text x="62" y="320" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="white">Eve Energy</text>
    <text x="62" y="335" font-family="-apple-system,sans-serif" font-size="9" fill="#96a6bd">Matter · Node 5</text>
    <rect x="210" y="310" width="54" height="22" rx="11" fill="#1c3656"/>
    <text x="237" y="325" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#69aeff">En ligne</text>

    <!-- Matter badge row 2 -->
    <rect x="20" y="360" width="260" height="52" rx="12" fill="#151f30" opacity="0.9" stroke="#65d8bb" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="40" y="384" font-family="sans-serif" font-size="16" fill="#65d8bb">◈</text>
    <text x="62" y="384" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="white">Ampoule Cuisine</text>
    <text x="62" y="399" font-family="-apple-system,sans-serif" font-size="9" fill="#96a6bd">Matter · Node 3</text>
    <rect x="210" y="374" width="54" height="22" rx="11" fill="#1a3828"/>
    <text x="237" y="389" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#65d8bb">En ligne</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="930" cy="315" r="260" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.05"/>
  <circle cx="930" cy="315" r="190" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.08"/>
  <circle cx="930" cy="315" r="120" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.12"/>

  <!-- Phone mockup -->
  <g filter="url(#glow)" transform="translate(770, 65)">
    <rect x="0" y="0" width="300" height="500" rx="34" ry="34" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.75"/>
    <rect x="10" y="10" width="280" height="480" rx="26" ry="26" fill="#0c1829" opacity="0.9"/>
    <!-- Notch -->
    <rect x="105" y="14" width="90" height="12" rx="6" fill="#3b82f6" opacity="0.3"/>


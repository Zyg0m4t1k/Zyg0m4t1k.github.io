    <circle cx="250" cy="56" r="8" fill="#65d8bb" opacity="0.8"/>
    <text x="230" y="60" font-family="-apple-system,sans-serif" font-size="9" fill="#65d8bb">●</text>

    <!-- Dashboard grid -->
    <!-- Row 1 -->
    <rect x="20" y="88" width="118" height="90" rx="12" fill="#151f30" opacity="0.9" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="79" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#ffd166">💡</text>
    <text x="79" y="136" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white">Salon</text>
    <rect x="52" y="146" width="54" height="18" rx="9" fill="#1c3a60" opacity="0.9"/>
    <text x="79" y="159" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#69aeff">ON  80%</text>

    <rect x="162" y="88" width="118" height="90" rx="12" fill="#151f30" opacity="0.9" stroke="#65d8bb" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="221" y="118" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#65d8bb">🔌</text>
    <text x="221" y="136" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white">Prise Bureau</text>
    <rect x="195" y="146" width="52" height="18" rx="9" fill="#1a3828" opacity="0.9"/>
    <text x="221" y="159" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#65d8bb">ON</text>


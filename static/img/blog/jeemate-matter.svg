    <rect x="20" y="192" width="118" height="90" rx="12" fill="#151f30" opacity="0.9" stroke="#f5bc66" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="79" y="222" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#f5bc66">🌡️</text>
    <text x="79" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white">Chambre</text>
    <text x="79" y="256" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#f5bc66">21.4°C</text>

    <rect x="162" y="192" width="118" height="90" rx="12" fill="#151f30" opacity="0.9" stroke="#96a6bd" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="221" y="222" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#96a6bd">🚪</text>
    <text x="221" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="white">Entrée</text>
    <text x="221" y="256" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#65d8bb">Fermé</text>

    <!-- Row 3 — Matter badge -->

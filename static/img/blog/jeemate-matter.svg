  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3">JEEMATE · iOS &amp; ANDROID</text>

  <text x="120" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Contrôlez</text>
  <text x="120" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Matter</text>

  <text x="120" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#93c5fd">Application mobile Jeedom · Plugin Matter</text>

  <!-- Tags -->
  <g transform="translate(120, 420)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Béta-testeur</text>
  </g>
  <g transform="translate(274, 420)">
    <rect x="0" y="0" width="80" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="40" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Matter</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#040a14" opacity="0.7"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>

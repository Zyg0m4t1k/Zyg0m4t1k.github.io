    <text x="30" y="289" font-family="monospace" font-size="8" fill="#8a9ab2">LOG</text>
    <text x="30" y="303" font-family="monospace" font-size="8" fill="#69aeff">[12:03:01] ✓ Handshake OK — proxy actif</text>
    <text x="30" y="315" font-family="monospace" font-size="8" fill="#69aeff">[12:03:02] → start_scan</text>
    <text x="30" y="327" font-family="monospace" font-size="8" fill="#69aeff">[12:03:04] ✓ Device trouvé: Eve Energy</text>
    <text x="30" y="339" font-family="monospace" font-size="8" fill="#ffd166">[12:03:05] BTP handshake: write C1...</text>
    <text x="30" y="351" font-family="monospace" font-size="8" fill="#ffd166">[12:03:06] BTP handshake: subscribe C2...</text>
    <text x="30" y="363" font-family="monospace" font-size="8" fill="#69aeff">[12:03:07] ✓ BTP handshake OK</text>
    <text x="30" y="375" font-family="monospace" font-size="8" fill="#69aeff">[12:03:38] ✓ Commissionné — node_id=5</text>
    <text x="30" y="387" font-family="monospace" font-size="8" fill="#69aeff">[12:03:40] ✓ Eve Energy synchronisé</text>


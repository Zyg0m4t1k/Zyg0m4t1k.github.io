<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Phone mockup (right side) -->
  <g filter="url(#glow)" transform="translate(760, 70)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="310" height="490" rx="34" ry="34" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.75"/>
    <rect x="10" y="10" width="290" height="470" rx="26" ry="26" fill="#0c1829" opacity="0.85"/>
    <!-- Notch -->
    <rect x="110" y="14" width="90" height="12" rx="6" fill="#3b82f6" opacity="0.3"/>
    <!-- Screen content -->
    <!-- Top bar -->
    <rect x="20" y="38" width="270" height="44" rx="0" fill="#1b283c" opacity="0.6"/>
    <rect x="30" y="48" width="26" height="26" rx="8" fill="#3b82f6" opacity="0.7"/>
    <text x="66" y="66" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="white">Jeeter</text>
    <!-- Status dot -->
    <circle cx="265" cy="61" r="5" fill="#69aeff" opacity="0.9"/>
    <text x="230" y="65" font-family="-apple-system,sans-serif" font-size="9" fill="#69aeff">Connecté</text>

    <!-- Phase bar -->
    <rect x="20" y="92" width="270" height="38" rx="8" fill="#151f30" opacity="0.8"/>
    <!-- Steps -->
    <circle cx="48" cy="111" r="10" fill="#69aeff"/>
    <text x="48" y="115" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="black">✓</text>
    <rect x="58" y="110" width="22" height="2" fill="#69aeff"/>
    <circle cx="90" cy="111" r="10" fill="#69aeff"/>
    <text x="90" y="115" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="black">✓</text>
    <rect x="100" y="110" width="22" height="2" fill="#69aeff"/>
    <circle cx="132" cy="111" r="10" fill="#69aeff"/>
    <text x="132" y="115" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="black">✓</text>
    <rect x="142" y="110" width="22" height="2" fill="#f5bc66"/>
    <circle cx="174" cy="111" r="10" fill="none" stroke="#f5bc66" stroke-width="2"/>
    <text x="174" y="115" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#f5bc66">≋</text>
    <rect x="184" y="110" width="22" height="2" fill="#243249"/>
    <circle cx="216" cy="111" r="10" fill="none" stroke="#34445d" stroke-width="1.5"/>


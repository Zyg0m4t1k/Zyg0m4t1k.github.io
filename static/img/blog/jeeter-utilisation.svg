  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3">JEETER · GUIDE D'UTILISATION</text>

  <text x="120" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Commissioning</text>
  <text x="120" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Matter BLE</text>

  <text x="120" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#93c5fd">Configuration · QR Code · Proxy · Notifications</text>

  <!-- Tags -->
  <g transform="translate(120, 420)">
    <rect x="0" y="0" width="100" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="50" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Bricolo</text>
  </g>
  <g transform="translate(234, 420)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Béta-testeur</text>

    <text x="51" y="449" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#8a9ab2">⌂</text>
    <text x="51" y="462" font-family="-apple-system,sans-serif" font-size="7" text-anchor="middle" fill="#8a9ab2">Jeedom</text>
    <text x="102" y="449" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#8a9ab2">⊞</text>
    <text x="102" y="462" font-family="-apple-system,sans-serif" font-size="7" text-anchor="middle" fill="#8a9ab2">Appareils</text>
    <rect x="130" y="428" width="50" height="30" rx="10" fill="#1c3656" opacity="0.8"/>
    <text x="155" y="449" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#69aeff">⌾</text>
    <text x="155" y="462" font-family="-apple-system,sans-serif" font-size="7" text-anchor="middle" fill="#69aeff">BLE</text>
    <text x="208" y="449" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#8a9ab2">ℹ</text>
    <text x="208" y="462" font-family="-apple-system,sans-serif" font-size="7" text-anchor="middle" fill="#8a9ab2">Infos</text>
    <text x="259" y="449" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#8a9ab2">⚙</text>
    <text x="259" y="462" font-family="-apple-system,sans-serif" font-size="7" text-anchor="middle" fill="#8a9ab2">Réglages</text>

    <!-- Home bar -->
    <rect x="120" y="478" width="70" height="5" rx="3" fill="#3b82f6" opacity="0.4"/>

    <!-- QR icon zone -->
    <rect x="30" y="150" width="60" height="60" rx="6" fill="#1c3656" opacity="0.8"/>
    <!-- QR pattern simplified -->
    <rect x="35" y="155" width="20" height="20" rx="2" fill="none" stroke="#69aeff" stroke-width="1.5"/>
    <rect x="38" y="158" width="14" height="14" rx="1" fill="#69aeff" opacity="0.3"/>
    <rect x="60" y="155" width="20" height="20" rx="2" fill="none" stroke="#69aeff" stroke-width="1.5"/>
    <rect x="35" y="180" width="20" height="20" rx="2" fill="none" stroke="#69aeff" stroke-width="1.5"/>
    <rect x="60" y="176" width="4" height="4" fill="#69aeff"/>
    <rect x="66" y="176" width="4" height="4" fill="#69aeff"/>
    <rect x="60" y="182" width="4" height="4" fill="#69aeff"/>
    <!-- Device info -->
    <text x="104" y="166" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="white">Eve Energy</text>
    <text x="104" y="181" font-family="-apple-system,sans-serif" font-size="9" fill="#74b9ff">0x0113 (Eve Systems)</text>
    <text x="104" y="196" font-family="-apple-system,sans-serif" font-size="9" fill="#f5bc66">PIN ••••••••</text>
    <rect x="104" y="202" width="30" height="14" rx="4" fill="#65d8bb" opacity="0.1"/>
    <text x="119" y="213" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#65d8bb">BLE</text>
    <rect x="138" y="202" width="34" height="14" rx="4" fill="#243249"/>
    <text x="155" y="213" font-family="-apple-system,sans-serif" font-size="8" text-anchor="middle" fill="#66758c">Wi-Fi</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2d4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#60a5fa" stroke-width="1" fill="none">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Diagram: assistants → JeeBridge → Jeedom scenarios -->
  <g filter="url(#glow)">
    <!-- Arrows from assistants to bridge -->
    <line x1="870" y1="200" x2="780" y2="270" stroke="#3b82f6" stroke-width="2" opacity="0.6" stroke-dasharray="6 3"/>
    <line x1="870" y1="315" x2="780" y2="315" stroke="#06b6d4" stroke-width="2.5" opacity="0.7" stroke-dasharray="6 3"/>
    <line x1="870" y1="430" x2="780" y2="360" stroke="#3b82f6" stroke-width="2" opacity="0.6" stroke-dasharray="6 3"/>

    <!-- Arrows from bridge to scenarios -->
    <line x1="700" y1="270" x2="620" y2="210" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="700" y1="315" x2="620" y2="315" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
    <line x1="700" y1="360" x2="620" y2="420" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

    <!-- Scenario boxes -->
    <rect x="480" y="178" width="130" height="44" rx="10" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
    <rect x="480" y="293" width="130" height="44" rx="10" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
    <rect x="480" y="398" width="130" height="44" rx="10" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>

    <!-- JeeBridge center node -->
    <rect x="700" y="270" width="80" height="90" rx="14" fill="#1e3a5f" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="740" y="320" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">Jee</text>
    <text x="740" y="333" font-family="-apple-system,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">Bridge</text>

    <!-- Assistant nodes -->
    <!-- Apple -->
    <rect x="870" y="172" width="80" height="56" rx="12" fill="#1f1f1f" stroke="#aaaaaa" stroke-width="1.5"/>
    <text x="910" y="203" font-family="-apple-system,sans-serif" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="600"> Home</text>
    <!-- Alexa -->
    <rect x="870" y="287" width="80" height="56" rx="12" fill="#0a1628" stroke="#00caff" stroke-width="1.5"/>
    <text x="910" y="318" font-family="-apple-system,sans-serif" font-size="12" fill="#00caff" text-anchor="middle" font-weight="600">Alexa</text>
    <!-- Google -->
    <rect x="870" y="402" width="80" height="56" rx="12" fill="#1a1a2e" stroke="#4285f4" stroke-width="1.5"/>
    <text x="910" y="433" font-family="-apple-system,sans-serif" font-size="12" fill="#4285f4" text-anchor="middle" font-weight="600">Google</text>
  </g>

  <!-- Scenario labels -->
  <text x="545" y="205" font-family="-apple-system,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">🎬 Cinéma</text>
  <text x="545" y="320" font-family="-apple-system,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">🌙 Bonne nuit</text>
  <text x="545" y="425" font-family="-apple-system,sans-serif" font-size="12" fill="#86efac" text-anchor="middle">🚪 Je pars</text>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.7"/>

  <!-- Text -->
  <text x="120" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3">JEEDOM × MATTER</text>
  <text x="120" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="50" fill="#f0f9ff" font-weight="800">"Lance le mode</text>
  <text x="120" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="50" fill="#f0f9ff" font-weight="800">cinéma"</text>
  <text x="120" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#f59e0b" font-weight="700">→ 12 actions Jeedom</text>
  <text x="120" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#93c5fd" font-weight="400">Alexa · Apple Home · Google Home</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#060f1a" opacity="0.6"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- BLE signal circles (centered right) -->
  <circle cx="930" cy="315" r="260" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.06"/>
  <circle cx="930" cy="315" r="190" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.09"/>
  <circle cx="930" cy="315" r="120" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.14"/>

  <!-- iPhone outline (left phone) -->
  <g filter="url(#glow)" transform="translate(730, 155)">
    <rect x="0" y="0" width="115" height="205" rx="20" ry="20" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.75"/>
    <rect x="8" y="20" width="99" height="157" rx="5" ry="5" fill="#1e3a8a" opacity="0.45"/>
    <!-- notch -->
    <rect x="36" y="6" width="43" height="10" rx="5" fill="#3b82f6" opacity="0.3"/>
    <!-- home bar -->
    <rect x="38" y="188" width="39" height="6" rx="3" fill="#3b82f6" opacity="0.4"/>
    <!-- iOS label -->
    <text x="57" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#93c5fd" opacity="0.9">iOS</text>
    <text x="57" y="128" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#60a5fa" opacity="0.8">📱</text>
  </g>

  <!-- Android outline (right phone) -->
  <g filter="url(#glow)" transform="translate(880, 165)">
    <rect x="0" y="0" width="115" height="205" rx="14" ry="14" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.75"/>
    <rect x="8" y="12" width="99" height="165" rx="4" ry="4" fill="#164e63" opacity="0.4"/>
    <!-- camera -->
    <circle cx="57" cy="7" r="4" fill="#06b6d4" opacity="0.4"/>
    <!-- Android label -->
    <text x="57" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#67e8f9" opacity="0.9">Android</text>
    <text x="57" y="128" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#06b6d4" opacity="0.8">📱</text>
  </g>

  <!-- BLE logo centered between phones -->
  <g filter="url(#glow)" transform="translate(930,315)">
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="-16,-12 16,12" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <polyline points="16,-12 -16,12" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <polyline points="0,-28 16,-12" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <polyline points="0,28 16,12" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Matter badge -->
  <g transform="translate(848, 420)">
    <rect x="0" y="0" width="168" height="34" rx="10" fill="#1d4ed8" opacity="0.7" stroke="#60a5fa" stroke-width="1"/>
    <text x="84" y="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#bfdbfe" letter-spacing="2">MATTER BLE</text>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3">JEETER · iOS &amp; ANDROID</text>

  <text x="120" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Proxy BLE</text>
  <text x="120" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Matter</text>

  <text x="120" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#93c5fd">Sideloadly · APK · Commissioning Jeedom</text>

  <!-- Tags -->
  <g transform="translate(120, 420)">
    <rect x="0" y="0" width="100" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="50" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Bricolo</text>
  </g>
  <g transform="translate(234, 420)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e3a8a" opacity="0.7" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">Béta-testeur</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#040a14" opacity="0.7"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>

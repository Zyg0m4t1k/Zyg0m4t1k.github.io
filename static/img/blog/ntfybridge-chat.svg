<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Circles decoration -->
  <circle cx="950" cy="315" r="220" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.07"/>
  <circle cx="950" cy="315" r="160" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.10"/>
  <circle cx="950" cy="315" r="100" fill="#1e3a8a" opacity="0.2"/>

  <!-- Chat bubbles (right side, decorative) -->
  <!-- Bubble 1 (incoming) -->
  <g filter="url(#glow)" transform="translate(740, 195)">
    <rect x="0" y="0" width="200" height="56" rx="16" ry="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <polygon points="12,56 0,72 28,56" fill="#1e3a8a"/>
    <rect x="16" y="16" width="90" height="10" rx="5" fill="#3b82f6" opacity="0.7"/>
    <rect x="16" y="32" width="60" height="8" rx="4" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- Bubble 2 (outgoing) -->
  <g filter="url(#glow)" transform="translate(820, 290)">
    <rect x="0" y="0" width="180" height="50" rx="16" ry="16" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <polygon points="168,50 180,66 156,50" fill="#1d4ed8"/>
    <rect x="14" y="14" width="80" height="9" rx="4" fill="#60a5fa" opacity="0.7"/>
    <rect x="14" y="28" width="50" height="7" rx="3" fill="#93c5fd" opacity="0.5"/>
  </g>

  <!-- Bubble 3 (incoming) -->
  <g filter="url(#glow)" transform="translate(750, 380)">
    <rect x="0" y="0" width="160" height="44" rx="14" ry="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <polygon points="12,44 0,58 26,44" fill="#1e3a8a"/>
    <rect x="14" y="12" width="70" height="8" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="14" y="25" width="45" height="7" rx="3" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- PWA icon hint -->
  <g transform="translate(930, 290)" opacity="0.45">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="40" font-family="sans-serif" font-size="28" text-anchor="middle" fill="#60a5fa">💬</text>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3">NTFYBRIDGE · CHAT FAMILLE</text>

  <text x="120" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Messagerie</text>
  <text x="120" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">domotique privée</text>

  <text x="120" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#93c5fd">PWA · Push notifications · Fichiers</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#040a14" opacity="0.7"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f1c"/>
      <stop offset="100%" stop-color="#0a2520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.12" fill="#10b981">
    <circle cx="150" cy="105" r="2"/><circle cx="300" cy="105" r="2"/><circle cx="450" cy="105" r="2"/>
    <circle cx="600" cy="105" r="2"/><circle cx="750" cy="105" r="2"/><circle cx="900" cy="105" r="2"/>
    <circle cx="1050" cy="105" r="2"/>
    <circle cx="150" cy="210" r="2"/><circle cx="300" cy="210" r="2"/><circle cx="450" cy="210" r="2"/>
    <circle cx="600" cy="210" r="2"/><circle cx="750" cy="210" r="2"/><circle cx="900" cy="210" r="2"/>
    <circle cx="1050" cy="210" r="2"/>
    <circle cx="150" cy="315" r="2"/><circle cx="300" cy="315" r="2"/><circle cx="450" cy="315" r="2"/>
    <circle cx="600" cy="315" r="2"/><circle cx="750" cy="315" r="2"/><circle cx="900" cy="315" r="2"/>
    <circle cx="1050" cy="315" r="2"/>
    <circle cx="150" cy="420" r="2"/><circle cx="300" cy="420" r="2"/><circle cx="450" cy="420" r="2"/>
    <circle cx="600" cy="420" r="2"/><circle cx="750" cy="420" r="2"/><circle cx="900" cy="420" r="2"/>
    <circle cx="1050" cy="420" r="2"/>
    <circle cx="150" cy="525" r="2"/><circle cx="300" cy="525" r="2"/><circle cx="450" cy="525" r="2"/>
    <circle cx="600" cy="525" r="2"/><circle cx="750" cy="525" r="2"/><circle cx="900" cy="525" r="2"/>
    <circle cx="1050" cy="525" r="2"/>
  </g>

  <!-- Shield + lock icon (right side, decorative) -->
  <g transform="translate(860, 215)" opacity="0.18" fill="#10b981">
    <path d="M100 0 L200 40 L200 140 Q200 200 100 240 Q0 200 0 140 L0 40 Z"/>
  </g>
  <g transform="translate(910, 275)" opacity="0.3" fill="none" stroke="#10b981" stroke-width="3">
    <path d="M50 0 L100 20 L100 70 Q100 100 50 120 Q0 100 0 70 L0 20 Z"/>
    <rect x="25" y="55" width="50" height="35" rx="5"/>
    <circle cx="50" cy="62" r="10" fill="#10b981" opacity="0.5"/>
  </g>

  <!-- Bell icon (center-right, glowing) -->
  <g transform="translate(780, 240)" filter="url(#glow)">
    <path d="M60 10 Q60 0 50 0 Q40 0 40 10 Q20 20 20 50 L10 60 L90 60 L80 50 Q80 20 60 10 Z" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <rect x="40" y="60" width="20" height="10" rx="5" fill="#10b981"/>
    <circle cx="50" cy="30" r="8" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Pulse rings -->
  <circle cx="830" cy="310" r="60" fill="none" stroke="#10b981" stroke-width="1" opacity="0.12"/>
  <circle cx="830" cy="310" r="90" fill="none" stroke="#10b981" stroke-width="1" opacity="0.07"/>
  <circle cx="830" cy="310" r="120" fill="none" stroke="#10b981" stroke-width="1" opacity="0.04"/>

  <!-- Arrow: phone → server -->
  <g opacity="0.35">
    <line x1="680" y1="310" x2="760" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="8 4"/>
    <polygon points="760,305 775,310 760,315" fill="#10b981"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#34d399" font-weight="600" letter-spacing="3">NTFYBRIDGE × TAILSCALE</text>

  <text x="120" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#ecfdf5" font-weight="800">Notifications</text>
  <text x="120" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#ecfdf5" font-weight="800">sans port ouvert</text>

  <text x="120" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#6ee7b7">Privé · Chiffré · Zéro config réseau</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#060f0d" opacity="0.6"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#4b5563">zyg0m4t1k.github.io</text>
</svg>

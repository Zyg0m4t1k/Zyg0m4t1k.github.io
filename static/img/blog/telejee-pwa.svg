<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="315" r="280" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.05"/>
  <circle cx="950" cy="315" r="210" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.07"/>
  <circle cx="950" cy="315" r="140" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.10"/>

  <!-- Smartphone outline -->
  <g filter="url(#glow)" transform="translate(760, 100)">
    <!-- Phone body -->
    <rect x="0" y="0" width="160" height="310" rx="26" ry="26" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
    <rect x="10" y="10" width="140" height="290" rx="18" ry="18" fill="url(#screen)" opacity="0.9"/>
    <!-- Dynamic island -->
    <rect x="52" y="18" width="56" height="12" rx="6" fill="#f59e0b" opacity="0.3"/>
    <!-- Home bar -->
    <rect x="55" y="292" width="50" height="6" rx="3" fill="#f59e0b" opacity="0.4"/>

    <!-- Screen content: tab bar -->
    <rect x="10" y="260" width="140" height="30" rx="0" fill="#1e293b" opacity="0.95"/>
    <line x1="10" y1="260" x2="150" y2="260" stroke="#334155" stroke-width="1"/>
    <!-- Tab icons -->
    <!-- TV tab -->
    <rect x="22" y="267" width="28" height="17" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <line x1="29" y1="284" x2="43" y2="289" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <line x1="43" y1="284" x2="29" y2="289" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <!-- Remote tab -->
    <circle cx="80" cy="275" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <circle cx="80" cy="275" r="2" fill="#94a3b8" opacity="0.5"/>
    <!-- Settings tab -->
    <circle cx="124" cy="275" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="124" y1="268" x2="124" y2="271" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="124" y1="279" x2="124" y2="282" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="117" y1="275" x2="120" y2="275" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    <line x1="128" y1="275" x2="131" y2="275" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>

    <!-- Screen content: TV guide cards -->
    <!-- Card 1 -->
    <rect x="18" y="45" width="124" height="52" rx="6" fill="#1e3a5f" opacity="0.85"/>
    <rect x="18" y="45" width="44" height="52" rx="6" fill="#1d4ed8" opacity="0.5"/>
    <text x="40" y="77" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#93c5fd" opacity="0.9">📺</text>
    <rect x="68" y="52" width="64" height="6" rx="3" fill="#f8fafc" opacity="0.7"/>
    <rect x="68" y="63" width="48" height="5" rx="2.5" fill="#94a3b8" opacity="0.5"/>
    <rect x="68" y="74" width="36" height="5" rx="2.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Card 2 -->
    <rect x="18" y="105" width="124" height="52" rx="6" fill="#1e3a5f" opacity="0.75"/>
    <rect x="18" y="105" width="44" height="52" rx="6" fill="#7c3aed" opacity="0.45"/>
    <text x="40" y="137" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#c4b5fd" opacity="0.9">🎬</text>
    <rect x="68" y="112" width="56" height="6" rx="3" fill="#f8fafc" opacity="0.6"/>
    <rect x="68" y="123" width="42" height="5" rx="2.5" fill="#94a3b8" opacity="0.45"/>
    <rect x="68" y="134" width="30" height="5" rx="2.5" fill="#a78bfa" opacity="0.6"/>
    <!-- Card 3 -->
    <rect x="18" y="165" width="124" height="52" rx="6" fill="#1e3a5f" opacity="0.65"/>
    <rect x="18" y="165" width="44" height="52" rx="6" fill="#065f46" opacity="0.5"/>
    <text x="40" y="197" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#6ee7b7" opacity="0.9">⚽</text>
    <rect x="68" y="172" width="50" height="6" rx="3" fill="#f8fafc" opacity="0.55"/>
    <rect x="68" y="183" width="38" height="5" rx="2.5" fill="#94a3b8" opacity="0.4"/>
    <rect x="68" y="194" width="44" height="5" rx="2.5" fill="#34d399" opacity="0.6"/>

    <!-- Active tab indicator -->
    <rect x="22" y="258" width="28" height="2" rx="1" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.8"/>

  <!-- Text block -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#fbbf24" font-weight="600" letter-spacing="3">TELEJEE · PWA</text>

  <text x="120" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">Guide TV</text>
  <text x="120" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" fill="#f0f9ff" font-weight="800">&amp; Télécommande</text>

  <text x="120" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#94a3b8">sur votre smartphone · sans app à installer</text>

  <!-- Tags -->
  <g transform="translate(120, 418)">
    <rect x="0" y="0" width="90" height="30" rx="8" fill="#78350f" opacity="0.75" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#fde68a">Telejee</text>
  </g>
  <g transform="translate(224, 418)">
    <rect x="0" y="0" width="70" height="30" rx="8" fill="#1e3a8a" opacity="0.75" stroke="#3b82f6" stroke-width="1"/>
    <text x="35" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#bfdbfe">PWA</text>
  </g>
  <g transform="translate(308, 418)">
    <rect x="0" y="0" width="100" height="30" rx="8" fill="#134e4a" opacity="0.75" stroke="#14b8a6" stroke-width="1"/>
    <text x="50" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" text-anchor="middle" fill="#99f6e4">Domotique</text>
  </g>

  <!-- PWA install badge -->
  <g filter="url(#softglow)" transform="translate(760, 445)">
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#78350f" opacity="0.8" stroke="#f59e0b" stroke-width="1"/>
    <text x="80" y="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fde68a" letter-spacing="1.5">INSTALLABLE</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#040a14" opacity="0.7"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>

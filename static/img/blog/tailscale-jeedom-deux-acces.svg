<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#0d2d4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="1" fill="none">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <g filter="url(#glow)">
    <!-- Route 1: Phone → VM (subnet router) → Pi — dashed blue -->
    <line x1="998" y1="316" x2="848" y2="223" stroke="#3b82f6" stroke-width="2.5" opacity="0.65" stroke-dasharray="7 4"/>
    <line x1="772" y1="223" x2="670" y2="316" stroke="#3b82f6" stroke-width="2.5" opacity="0.65" stroke-dasharray="7 4"/>

    <!-- Route 2: Phone → Pi direct — solid teal arc (toujours accessible) -->
    <path d="M998,340 Q880,430 670,340" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.9"/>

    <!-- VM / Subnet Router node -->
    <rect x="772" y="157" width="76" height="66" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <rect x="784" y="168" width="52" height="7" rx="2" fill="#0f2744" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
    <rect x="784" y="181" width="52" height="7" rx="2" fill="#0f2744" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <rect x="784" y="194" width="52" height="7" rx="2" fill="#0f2744" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <circle cx="839" cy="171" r="3" fill="#f59e0b"/>
    <circle cx="839" cy="184" r="3" fill="#374151"/>
    <circle cx="839" cy="197" r="3" fill="#374151"/>

    <!-- Jeedom / Pi node -->
    <circle cx="620" cy="316" r="50" fill="#1e3a5f" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="620" cy="316" r="34" fill="#0f2744" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

    <!-- Phone node -->
    <rect x="998" y="283" width="48" height="64" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <rect x="1012" y="291" width="20" height="32" rx="2" fill="#0f2744"/>
    <circle cx="1022" cy="330" r="3" fill="#60a5fa"/>
  </g>

  <!-- Warning badge on VM -->
  <circle cx="848" cy="157" r="13" fill="#f59e0b" stroke="#0c1829" stroke-width="2"/>
  <text x="848" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#0c1829" font-weight="800">!</text>

  <!-- Tailscale icon in Jeedom node -->
  <g transform="translate(596, 292)">
    <path d="M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="12" cy="12" r="5" fill="#3b82f6"/>
    <line x1="12" y1="0" x2="12" y2="7" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="12" y1="17" x2="12" y2="24" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="0" y1="6" x2="7" y2="9.5" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="17" y1="14.5" x2="24" y2="18" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="24" y1="6" x2="17" y2="9.5" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="7" y1="14.5" x2="0" y2="18" stroke="#60a5fa" stroke-width="1.5"/>
  </g>

  <!-- Node labels -->
  <text x="620" y="388" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#93c5fd" font-weight="600">Jeedom</text>
  <text x="810" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#60a5fa">VM Routeur</text>

  <!-- Route 1 labels -->
  <text x="936" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#93c5fd" opacity="0.85">192.168.1.x</text>
  <text x="707" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#f87171" opacity="0.9">VM down → accès coupé</text>

  <!-- Route 2 label -->
  <text x="845" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#34d399" font-weight="600">100.x.x.x — toujours accessible ✓</text>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="4" height="470" fill="url(#accent)" rx="2" opacity="0.7"/>

  <!-- Text content -->
  <text x="120" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#60a5fa" font-weight="600" letter-spacing="3" text-anchor="start">TAILSCALE · JEEDOM</text>

  <text x="120" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" fill="#f0f9ff" font-weight="800" text-anchor="start">Deux voies</text>
  <text x="120" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" fill="#f0f9ff" font-weight="800" text-anchor="start">d'accès</text>
  <text x="120" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" fill="#f59e0b" font-weight="800" text-anchor="start">à distance</text>

  <text x="120" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#93c5fd" font-weight="400" text-anchor="start">Routeur ou nœud direct ?</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#060f1a" opacity="0.6"/>
  <text x="120" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#475569">zyg0m4t1k.github.io</text>
</svg>
